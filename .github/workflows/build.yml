name: Build APK
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'settingsapp/**'
      - '.github/workflows/build-settings.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Inject feedback email endpoint (from repo secret)
        env:
          FORMSUBMIT_URL: ${{ secrets.FORMSUBMIT_URL }}
        run: |
          if [ -n "$FORMSUBMIT_URL" ]; then
            sed -i "s|FEEDBACK_ENDPOINT_PLACEHOLDER|$FORMSUBMIT_URL|" app/src/main/java/com/koshertech/hub/MainActivity.kt
            echo "Feedback endpoint injected from secret."
          else
            echo "No FORMSUBMIT_URL secret set; email delivery stays off."
          fi
      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KosherTechHub.apk
      - name: Make version.json
        run: |
          NOTES=$(cat whatsnew.txt 2>/dev/null || git log -1 --pretty=%s)
          jq -n \
            --argjson vc ${{ github.run_number }} \
            --arg vn "1.0.${{ github.run_number }}" \
            --arg url "https://github.com/mechelr/koshertech-hub/releases/download/latest/KosherTechHub.apk" \
            --arg notes "$NOTES" \
            '{versionCode:$vc, versionName:$vn, url:$url, notes:$notes}' > version.json
          cat version.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: koshertech-hub-apk
          path: KosherTechHub.apk
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KosherTech Hub
          files: |
            KosherTechHub.apk
            version.json
            zemer.apk
