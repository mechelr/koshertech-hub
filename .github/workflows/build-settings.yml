name: Build Settings APK
on:
  push:
    branches: [ "main" ]
    paths:
      - 'settingsapp/**'
      - '.github/workflows/build-settings.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: settingsapp
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp settingsapp/app/build/outputs/apk/debug/app-debug.apk KosherTechSettings.apk
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: settings
          name: KosherTech Settings
          files: KosherTechSettings.apk
