plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.koshertech.hub'
    compileSdk 34

    defaultConfig {
        applicationId "com.koshertech.hub"
        minSdk 24
        targetSdk 34
        versionCode ((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName "1.0." + ((System.getenv("VERSION_CODE") ?: "1"))
    }

    signingConfigs {
        koshertech {
            storeFile file("koshertech.jks")
            storePassword "koshertech2026"
            keyAlias "koshertech"
            keyPassword "koshertech2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.koshertech
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.koshertech
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'com.kosherjava:zmanim:2.5.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
