plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.koshertech.settings'
    compileSdk 34
    defaultConfig {
        applicationId "com.koshertech.settings"
        minSdk 24
        targetSdk 34
        versionCode ((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName "1.0." + ((System.getenv("VERSION_CODE") ?: "1"))
    }
    signingConfigs {
        koshertech {
            storeFile file("koshertech.jks")
            storePassword "koshertech2026"
            keyAlias "koshertech"
            keyPassword "koshertech2026"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.koshertech }
        release { minifyEnabled false; signingConfig signingConfigs.koshertech }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
